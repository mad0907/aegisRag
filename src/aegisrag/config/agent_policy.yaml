# AI control plane (§21 of the design doc) — the single source of truth for agent behavior.
# Nothing here is duplicated in Python or .env; orchestrator, guardrails and the review queue
# all read this one file through config/control_plane.py. Bump `version` on any change — it's
# stamped onto every audit_log row so a behavior change is traceable to the run that made it.
version: "1.4"

max_iterations: 3

retrieval:
  min_score: 0.70
  # Trimmed from 6 -> 4 for latency: fewer passages means a shorter prompt into every
  # evidence-validation/synthesis/quality call, on a CPU-only model where prompt+generation
  # time is the dominant per-query cost. 4 was still enough evidence in every case tested.
  top_k: 4

answer:
  auto_threshold: 0.85
  qualify_threshold: 0.60

human_review:
  enabled: true
  confidence_threshold: 0.60
  # A query touching any of these (case-insensitive substring) forces review regardless of
  # confidence — §17 of the design doc.
  high_risk_keywords:
    - compliance
    - legal
    - approve
    - approval
    - policy violation
    - regulatory
    - audit finding
    - terminate
    - disciplinary

fallback:
  enabled: true
  max_attempts: 2
  # Model-level fallback (§18): a secondary, smaller model tried if the primary model errors
  # or times out. Retrieval-only degrade (no synthesis) is the final floor below that — never
  # an invented answer with no model available.
  secondary_model_enabled: true

# Not every step needs an LLM call. Flip `enabled: false` here to force every step through the
# model (higher latency, maximum reasoning quality — the right setting on GPU/cloud hardware
# where an LLM call is cheap); leave it `true` for CPU-constrained local demos. Every bypass is
# still logged to the audit trail, same as an LLM call would be.
smart_bypass:
  enabled: true
  planner_heuristic: true
  evidence_similarity_threshold: 0.60

# Semantic answer cache: a close-enough repeat/paraphrase of a past question skips retrieval AND
# every agent LLM call entirely. Measured on this corpus: an identical question scores 1.0, real
# paraphrases scored 0.93-0.97, a genuinely different question scored 0.80 — 0.92 sits with margin
# on both sides. Only ever caches a genuinely-answered result (never an abstain or a pending review).
#
# `enabled` and `store_enabled` are independent — `enabled` gates the LOOKUP (can a cache hit
# short-circuit the pipeline), `store_enabled` gates the STORE (does a fresh answer get saved
# afterward). Left split on purpose: turning `enabled` off to force every question through the
# full pipeline for a demo would otherwise also stop the cache from accumulating data — with
# `store_enabled` staying true, the cache keeps building silently even while lookups are off.
#
# DEMO TOGGLE: flip `enabled: false` here (and/or smart_bypass.enabled above) to force every
# question through the full 5-agent pipeline with no shortcuts — restart `make api` after
# editing (this file is loaded once at startup and cached). Useful to show "with vs without"
# side by side: ask the same question with each setting and compare the Phoenix trace.
answer_cache:
  enabled: true
  store_enabled: true
  similarity_threshold: 0.92

# A different kind of latency lever from the two above: smart_bypass and answer_cache AVOID
# work; this makes the work itself cheaper. Only the Planner is routed to OLLAMA_LIGHT_MODEL
# (llama3.2:1b) instead of the primary model. Evidence Validator and Citation & Quality look
# like equally good candidates (also short structured JSON) but were tried and rejected: on
# this corpus the 1B model produced an unreliable verdict/confidence score on those two --
# cheap to be wrong on the Planner's coarse retrieval decision, expensive to be wrong on a
# judgment gate the rest of the pipeline trusts. See orchestrator.py's _LIGHT_TIER_AGENTS and
# doc/13-latency-optimization.md for the measured runs behind this call.
model_tiering:
  enabled: true
