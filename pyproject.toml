[project]
name = "aegisrag"
version = "0.1.0"
description = "AegisRAG — Agentic Enterprise Document Intelligence Platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",

    "docling>=2.0",

    "llama-index-core>=0.11",
    "llama-index-embeddings-ollama",

    "crewai>=0.70",
    "litellm",

    "psycopg[binary]>=3.1",
    "pgvector>=0.3",

    "ragas>=0.2",
    "datasets>=2.20",

    "arize-phoenix>=6.0",
    "openinference-instrumentation-llama-index",
    "openinference-instrumentation-litellm",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",

    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
